    ResponseBody_PostProduct:
      type: object
      required:
        - date
        - result
        - resultid
        - data
      properties:
        date:
          type: string
          format: date-time
          description: Дата формирования ответа на запрос
          example: 2022-12-12T09:48:54.000Z
        result:
          type: boolean
          example: true
          description: Общий результат обработки запроса (проверка на наличие общих ошибок)
        resultid:
          type: string
          description: идентификатор результата обработки запроса в базе лог. провайдера
          example: 338fd9b8-8ac8-46ae-91f2-bf64ea3966f6
        resulttext:
          type: string
          description: >-
            Описание общей ошибки выполнения при ее наличии (если общих ошибок
            нет, то пусто)
          example: null
        infolist:
          type: array
          items:
            type: integer
          description: Список информационных сообщений от лог. провайдера
          example: null
        data:
          type: object
          properties:
            resullist:
              type: array
              items:
                type: object
                properties:
                  Код:
                    type: string
                    description: в разработке
                  ИД:
                    type: string
                    description: в разработке
                  Наименование:
                    type: string
                    description: в разработке
                  ШК:
                    type: string
                    description: в разработке
                  Ошибка:
                    type: boolean
                    description: Краткий отчет об ошибках во время загрузки Товара
                    example: false
    
