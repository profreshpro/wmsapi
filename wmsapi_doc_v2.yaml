openapi: 3.0.0
info:
  title: Описание интерфейса Rest API ПроФреш
  version: '2.6'
  description: "# Общее описание\n
    Обмен осуществляется отправкой запросов на сервер лог провайдера.

    Ваш базовый идентификатор WMSID - это код, который предоставляет вам лог.
    провайдер при заключении договора о сотрудничестве.


    Все даты при обмене необходимо указывать по стандарту RFC 3339 (YYYY-MM-DDTHH:MM:SSZ)


    Авторизация: метод авторизации Basic Auth (указание логина и пароля) +
    APIKEY в Заголовке запроса (имя поля apikey). Данные авторизации
    предоставляются отдельно по письменному запросу к лог. оператору. Сначала для
    тестового контура, после отладки к рабочему.


    Полезные ссылки:

     - [Сайт компании ООО ПроФреш](https://profresh.ru/)\n
     - [Описание в оригинальном swagger-формате](https://app.swaggerhub.com/apis-docs/profresh.pro/wmsapidocv2)
    "
  contact:
    name: ПроФреш API Support
    url: https://profresh.ru/api/docv2/
    email: it.prog@profresh.pro
  
servers:
  - url: https://api.profresh.ru/sklad_api_test/hs/wmsapi  
    description: Тестовый API сервер
  - url: https://api.profresh.ru/"Требуемый склад"/hs/wmsapi
    description: Рабочий API сервер

tags:
- name: 1. Заказ
- name: 2. Поступление
- name: 3. Дополнительно

paths:
  /PostShipment:
    post:
      tags:
      - 1. Заказ
      summary: 1.1. Загрузить заказы [postshipment]
      description: Создать / обновить Заявку на ОТГРУЗКУ. Обновление возможно только для взятия документа в работу на складе лог. провайдера. После взятия заявки в работу допускается изменение доп. данных заявки через отдельный метод updateshipment
      operationId: postshipment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestBody_PostShipment'
      responses:
        200:
          description: 'ОК'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseBody_PostShipment'
        400:
          description: >-
            Ошибка в парамтерах со стороны поставщика, не указан входной
            параметр WMSID
        401:
          description: Ошибка аутентификации (логин, пароль, apikey)
        403:
          description: Не настроен API доступ стороны лог. провайдера
        404:
          description: Ошибка со стороны лог. провайдера блокировка параллельной обработкой данных
        5XX:
          description: >-
            Ошибка сервера лог. провайдера. Отправьте запрос повторно. В случае
            повторения ошибки сообщите лог. провайдеру на почту
            it.prog@profresh.pro
      parameters:
        - name: wmsid
          in: query
          description: >-
            Код клиента, выдается лог. провайдером при заключении договора о сотрудничестве
          required: true
          schema:
            type: string
          example: "0033"
        - name: action
          in: query
          description: >-
            Имя метода
          required: true
          schema:
            type: string
          example: "postshipment"
          
  /UpdateShipment:
    post:
      tags:
        - 1. Заказ
      summary: 1.2. Обновить доп. данных заказов [updateshipment]
      description: Запрос на обновление дополнительной информации по взятой в работу Заявке на ОТГРУЗКУ (номер накладной, список точек перегруза для Меркурий, гос. номер авто-ля самовывоза для Меркурий)
      operationId: updateshipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestBody_UpdateShipment'
      responses:
        200:
          description: ОК
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsBody'
        400:
          description: 'Ошибка в парамтерах со стороны поставщика, не указан входной
            параметр WMSID
            '
        401:
