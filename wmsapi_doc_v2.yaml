    ProductReception:
      type: object
      description: Номенклаура
      required:
        - Код
        - Артикул
        - Наименование
        - Весовой
        - СрокХранения
        - Коэффициент
        - ШК
        - Количество
      properties:
        Код:
          type: string
          maxLength: 36
          example: "00-00001258"
          description: Уникальный идентфикатор номенклатуры (в разрезе wmsid). Используется для синхронизации данных.
        Артикул:
          type: string
          maxLength: 15
          example: 93378
          description: Артикул товара, является свойством товара (обязателен в случае если поле Код передается в виде GUIDа). Артикул используется для дополнительной идентификации товара сотрудниками склада.
        Наименование:
          type: string
          maxLength: 150
          example: Колбаса докторская,  кг
          description: Наименование товара (Использвется в документах Торг12 и СФ)
        ДатаВыработки:
          type: string
          format: date
          maxLength: 20
          example: "2022-12-30T00:00:00.000Z"
          description: Дата выработки товара
        Количество:
          type: number
          example: 3
          description: Количество товара (в базовой ед. измерения)
        Весовой:
          type: boolean
          example: false
          description: Признак весового товара
        Коэффициент:
          type: number
          example: 0.55
          description: Вес одной единицы штучного товара (базовая ЕИ) в кг. Для весового товара = 1
        УпакИмя:
          type: string
          maxLength: 10
          example: коробка
          description: Наименование упаковки товара (Используется при печати ТОРГ12) (вид упаковки)
        УпакКратность:
          type: number
          format: float
          example: 3
          description: Количество единиц товара в одной упаковке. (Используется в печати ТОРГ12)
        ШК:
          type: string
          maxLength: 250
          example: 4612357894564
          description: Штриховой код товара. Допускается перечисление нескольких ШК через символ "~"
        СрокХранения:
          type: integer
          maxLength: 4
          example: 12
          description: Срок годности товара в днях
        GUID:
          type: string
          maxLength: 36
          example: fe226852-2bd7-4b53-be16-784bd69b21f1
          description: GUID наименования продукции в системе Меркурий [productItem.GUID]
        безВСД:
          type: boolean
          example: false
          description: Не требуется оформление эл. ВСД на данный товар
        Цена:
          type: number
          format: float
          example: 100
          description: Цена товара (залоговая)
        Производитель:
          type: string
          maxLength: 50
          example: "ООО Рога и Копыта"
          description: Наименование основного производителя/поставщика товара
    PrintForm:
      type: object
      description: Печатная форма
      required:
        - КодПечатнойФормы
        - КоличествоКопий
        - Номер
      properties:
        КодПечатнойФормы:
          type: integer
          maxLength: 1
