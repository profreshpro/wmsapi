          example: null
        infolist:
          type: array
          items:
            type: integer
          description: Список информационных сообщений от лог. провайдера
          example: null
        data:
          $ref: '#/components/schemas/ResponsBodyData'
          
    ResponsBodyData:
      properties:
        shipment:
          type: array
          items:
            type: object
            required:
              - ИД
              - Номер
              - лпИД
              - лпНомер
              - лпДата
              - Загружен
              - СписокОшибок
            properties:
              ИД:
                type: string
                maxLength: 36
