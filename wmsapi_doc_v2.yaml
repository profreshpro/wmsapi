                  Номер в учетной системе заказчика (уникальный в пределах года номер документа)
              ТТННомер:
                type: string
                maxLength: 30
                example: БП00545
                description: Номер накладной, если он известен. Если нет, тогда оставить незаполненным
              ДатаПоставки:
                type: string
