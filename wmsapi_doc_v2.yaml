        resultid:
          type: string
          description: идентификатор результата обработки запроса в базе лог. провайдера
          example: 338fd9b8-8ac8-46ae-91f2-bf64ea3966f6
        resulttext:
          type: string
          description: >-
            Описание общей ошибки выполнения при ее наличии (если общих ошибок
            нет, то пусто)
          example: null
        infolist:
          type: array
          items:
            type: integer
          description: Список информационных сообщений от лог. провайдера
          example: null
        data:
          type: object
          properties:
            rests:
              type: array
              items:
                type: object
                required:
                  - ТоварКод
                  - ТоварИмя
                  - КоличествоОстаток
                  - СписокПартий
                properties:
                  ТоварКод:
                    type: string
                    example: 1099
                    description: Код товара
                  ТоварИмя:
                    type: string
                    example: Ассорти эклеров 5 вкусов Карамель, Пралине, Шоколад, Ваниль, Кофе; 300г, шт
                    description: Наименование товара
                  КоличествоОстаток:
                    type: integer
                    example: 6
                    description: Количество товара (по всем партиям)
                  СписокПартий:
                    type: array
                    description: Массив данных о детализации остатка товара по датам выработки
                    items:
                      type: object
                      properties:
                        ДатаВыработки:
                          type: string
                          format: date-time
                          example: 2023-04-10T00:00:00
                          description: Дата выработки
                        КоличествоОстаток:
                          type: integer
                          example: 6
                          description: Количество товара (по всем партиям) 
      
    Shipment:
      description: Объект "Заявка на отгрузку"
      type: object
      required:
        - ИД
        - Номер
        - ДатаПоставки
        - ТипДокумента
        - ЭтоСамовывоз
        - Проведен
        - АдресДоставки
        - СуммаДокумента
        - Вес
        - Контрагент
        - Филиал
        - Товары
        - ПечатныеФормы
      properties:
        ИД:
          type: string
          maxLength: 36
          example: "5535f338-fd9e-4556-93da-d05351c46330"
          description: Уникальный ID заказа
        Номер:
          type: string
          maxLength: 30
          example: 889843258
          description: >-
            Номер в учетной системе заказчика (уникальный в пределах года номер документа. Уникальность должна соблюдаться и для заказов на доставку так и для заказов на возврат)
        ДатаПоставки:
          type: string
          format: date
          maxLength: 20
          example: 2022-12-30T00:00:00.000Z
          description: Желаемая дата доставки заказа
        ТипДокумента:
          type: string
          format: integer
          maxLength: 1
          example: 1
          description: |-
            Тип документа:
            * 1 - Заявка на отгрузку "Логистика" (сборка и доставка)
            * 4 – Заявка на отгрзку "Крос-доккинг" (доставка)
            * 2 – Заявка на забор возврата от клиента
        ЭтоСамовывоз:
          type: boolean
          example: false
          description: >-
            Флаг «Самовывоз».

            Если это Заказ на сборку (ТипДокумента=1), тогда:

            *  Истина  – Заказ с доставкой (по-умолчанию). 

            *  Ложь – Самовывоз, доставка НЕ осуществляется. 


            Если это Заказ на возврат от клиента (ТипДокумента=2), тогда

            *  Истина – Обязательный возврат. машина будет отправлена за возвратом даже если нет доставки по этому адресу.

            *  Ложь  – возврат будет получен только в том случае, если есть доставка заказов на этот адрес.
        Проведен:
          type: boolean
          example: true
          description: >
            Признак активности заказа на доставку 

            * Для отмены ранее загруженого заказа его можно выгрузить повторно с
            признаком Проведен = Ложь
        Контрагент:
          type: object
          $ref: '#/components/schemas/Partner'
          description: Описание контрагента / юр. лица получателя
        Филиал:
          type: object
          $ref: '#/components/schemas/Partner'
          description: Описание контрагента / юр. лица получателя
        ТранспортнаяКомпания:
          type: object
          $ref: '#/components/schemas/Partner'
          description: Описание Транспортной компании получателя
        АдресДоставки:
          type: string
          maxLength: 250
          example: Москва, ул. Радужная, д. 43
          description: >-
            Фактический адрес точки доставки, если доставка до Транспортной
            компании (далее ТК), тогда адрес ТК. Адрес должен быть заполнен
            согласно КЛАД. Адрес не должен содержать уточняющие комментарии
            (комментарии нужно передавать в поле COMMENT).
        СуммаДокумента:
          type: number
          format: float
          example: 1564.5
          description: Итоговая стоимость загружаемого заказа.
        Вес:
          type: number
          format: float
          example: 50
          description: Общий вес брутто по документу [кг]
        ВидДоверенности:
          type: number
          format: integer
          example: 32
          description: >-
            Вид доверенности/инкассации к заказу. Номер доверенности = номеру Торг12 если не указан иной не указан другой в поле NOMDOC.
            Допустимые значения :
            •	0 -  без доверенности
            •	10 - на получение денежных средств (пустая)
            •	11 - на получение денежных средств (сумма из поля SUMMAINC)
            •	12 - на получение денежных средств (сумма поставки из Торг12)
            •	13 – на получение денежных средств (сумма поставки из Торг12+сумма из поля SUMMAINC)
            •	20 - на получение товара (пустая, 6 строк)
            •	21 - на получение товара (Перечень ТМЦ из комментария к заказу)
            •	Если требуется доверенность с перечислением определенного товара, то она оформляется через дополнительную Заказ с типом Возврат (type=2). См. раздел «Возвраты и Доверенности»
        ПД_СопрДов:
          type: boolean
          example: true
          description: Флаг, признак необходимости печати сопроводительной доверенности к заказу.
        ПД_ДопДок:
          type: boolean
          example: true
          description: Флаг, признак необходимости печати сопроводительной доверенности к заказу.
        ПДСуммаИнкассации:
          type: number
          format: float
          example: 1564.5
          description: Сумма инкассации.  (фиксированная или дополнительная к сумме заказа, зависит от значения поля "ВидДоверенности")
        ВремяДоставки:
          type: string
          maxLength: 11
          example: 09:30~18:00
          description: >-
            Временное оно доставки, в формате «ЧЧ:ММ~ЧЧ:ММ». Внимание! Интервал
            описывается только цифрами. Минуты не учитываются. Совпадение начала
            и конца интервала считаются ошибочными. В случае ошибки или не
            заданного значения используется стандартное время с 9:30 до 18
            часов.
        КомментарийПолучитьДокументы:
          type: string
          maxLength: 200
          example: "1-Торг12, 2-СФ, Акт о получении"
          description: Список документов к получению для водителя. Здесь можно перечислить какие документы должна вернуть водителю торговая точка по данному заказу.
        КоличествоМест:
          type: number
          format: integer
          example: 32
          description: Количество транспортных мест в заказе (для режима кросс-докинга) 
        КоличествоПаллет:
          type: number
          format: integer
          example: 32
          description: Количество транспортных палет по заказу (для режима кросс-докинга)  
        Объем:
          type: number
          format: integer
          example: 32
          description: Общий объем Заказа [метр. кубич.]  
        ПечататьСертификаты:
          type: boolean
          example: true
          description: Признак печати перечня сертификатов по заказу
        ПечататьИзображенияСертификаты:
          type: boolean
          example: true
          description: Признак печати изображений сертификатов по заказу  
        ДатаПоставкиПечать:
          type: string
          format: date
          maxLength: 20
          example: 2022-12-30T00:00:00.000Z
          description: Дата для печатных форм документов, в случае если она отлична от даты поставки (поле ДатаПоставки)  
        ПД_ТекстТНп4:
          type: string
          maxLength: 300
          example: "123укппвапияваовщышапофыпол"
          description: Текст для пункта 4 Транспортной накладной.  
        ПДТрННомерНакладной:
          type: string
          maxLength: 50
          example: "Торг12:0004"
          description: Текст для печати в Транспортной накладной с указанием номера документа основания (в верхнем левом углу).   
        ПД_СФп8_Госконтракт:
          type: string
          maxLength: 150
          example: "Торг12:0004"
          description: Данные для заполнения графы 8 СФ – Номер гос контракта. Если данные не указаны в печатную форму подставляется «-»  
        ТекстДоверенности:
          type: string
          maxLength: 200
          example: "Текст дополнительной доверенности"
          description: Текст дополнительной доверенности (на сопровождение груза)
        ПДОснованиеТорг:
          type: string
          maxLength: 200
          example: "Основание ТОРГ-12"
          description: Содержание графы «Основание» для печатной формы Торг12  
        ПДПлательщикТорг:
          type: string
          maxLength: 300
          example: "ООО Рога и Копыта"
          description: Содержание графы «Плательщик» для печатной формы Торг12
        ПДОснованиеСФ:
          type: string
          maxLength: 200
          example: "Основание печатоной формы СФ"
          description: Содержание графы «Основание» для печатной формы СФ  
        ПДОснованиеТТН:
          type: string
          maxLength: 300
          example: "Основание печатоной формы ТТН"
          description: Содержание графы «Основание» для печатной формы ТТН
        ПД_ПРД_Номер:
          type: string
          maxLength: 100
          example: "12323452362"
          description: Номер платежно-расчетного документа (для СФ и УПД)  
        ПД_ПРД_Дата:
          type: string
          format: date
          maxLength: 20
          example: 2025-08-30T00:00:00.000Z
          description: Дата платежно-расчетного документа(для СФ и УПД)  
        ПДНомерСчета:
          type: string
          maxLength: 200
          example: "2435729445718"
          description: Номер счета для печати в ТОРГ12
        ПДШК:
          type: string
          maxLength: 500
          example: "(01)34957132(10)049571(11)09475"
          description: Дополнительный ШК для печати в шапке ТОРГ12
        СтатусРаспределения:
          type: number
          format: integer
          example: 999999999999
          description: Статус заказа. Используется для сортировки заказов при распределении товара. Сортировка производиться по возрастанию. (0 - наивысший, 999999999999 - низший)
        ПД_СетьЗаказНомер:
          type: string
          maxLength: 200
          example: "243572944-5718"
          description: Номер заказа сети. Номер заказа клиента для печати на накладных клиента и указания в ВСД. (Метро, Реал, АВ и других, требующих указывать в документах номер их заказа)
        ПД_СетьЗаказДата:
          type: string
          format: date
          maxLength: 20
          example: 2025-08-30T00:00:00.000Z
          description: Дата заказа сети. Дата заказа клиента для печати на накладных клиента и указания в ВСД
        НомерМагазина:
          type: string
          maxLength: 200
          example: "43944-5718"
          description: Номер магазина грузополучателя (Метро, Реал)
        КодПоставщика:
          type: string
          maxLength: 200
          example: "564546514"
          description: Код поставщика (Метро, Реал)
        ДР_ГрупповаяУпаковка:
          type: boolean
          example: true
          description: Параметр сборки заказа - «Дополнительная групповая упаковка». Флаг информирует сборщика о необходимости групповой упаковки товара. Например для авиадоставки, когда они принимают не паллетами спец упаковками.
        ДР_ПаллетныйЛистКЗаказу:
          type: boolean
          example: true
          description: Параметр сборки заказа. Информирует сборщика, что к заказу необходимо прикладывать паллетный лист
        ДР_МоноПаллет:
          type: boolean
          example: true
          description: Параметр сборки заказа. Информирует сборщика о том, что товар нужно отгружать на моно паллетах (один паллет – один товар).
        ДР_МоноДатаВыработки:
          type: boolean
          example: true
          description: Флаг для запрета отгрузки в заказе нескольких дат выработки для одного товара.
        ДР_ПримекаНаПаллетах:
          type: boolean
          example: true
          description: Параметр сборки заказа. Информирует сборщика о том, что заказ принимается в торговую точку только на паллетах
        ДР_СборкаНеперекрывающимисяСтолбцами:
          type: boolean
          example: true
          description: Параметр сборки заказа. Информирует сборщика о том, что заказ должен быть собран неперекрывающимися столбиками.
        ИнкассируемМы:
          type: boolean
          example: true
          description: Признак инкассации через юр. лицо ПроФреш. 
        КатегорияЗаказа:
          type: number
          format: integer
          example: 999999999999
          description: Категория заказа по температурному режиму доставки заказа.
            0-охлажденный
            1-заморозка
            2-сухой склад
            3-non food.
        УсловияПеревозкиТемп:
          type: string
          maxLength: 10
          example: "+0...+4"
          description: Температурные условия перевозки, которые будут отображаться в соответствующем разделе ТрН в виде переданной строки и обозначение температуры в Цельсиях ("+0...+4°С")
        ЭтоЗаморозка:
          type: boolean
          example: true
          description: Признак «Замороженный товар». Для заказов содержащих замороженный товар. Доставка должна осуществляться с соблюдением температурного режима ниже 0.
        ЭтоОхлажденка:
          type: boolean
          example: true
          description: Признак «Охлажденный товар». Для заказов содержащих охлажденный товар.
        ЭтоПерегруз:
          type: boolean
          example: true
          description: Признак «Перегруз». Для заказов с не фиксированным адресом доставки. Когда доставка осуществляется до точки перегруза в другую машину и Адрес доставки для данного кода грузополучателя не постоянен.  
        СпецЗаказ:
          type: boolean
          example: true
          description: Признак «Специальный заказ». Используется для отметки возвратов (ТипДокумента = 2) свежего товара. При установке данного признака в маршрут водителя добавляется обратный рейс на склад ПроФреш. За данную услугу может взиматься дополнительная плата. 
        ЭтоБонус:
          type: boolean
          example: true
          description: Бонусный заказа или реализация образцов (без оплаты). Для него формируется специфический комплект документов. Обычно акт на передачу ТМЦ.
        НомерПоступления:
          type: string
          maxLength: 30
          example: "43944-5718"
          description: Номер поступления. Для заказов КроссДокинг. Это идентификатор конкретной поставки заказов кроссдокинг на склад ПроФреш. Этот номер используется для разделения заказов по нескольким документам «Заказ на доставку».  
        НеРасформировывать:
          type: boolean
          example: true
          description: Признак невозможности расформирования паллет после сборки. true - расформировывать нельзя, false - можно.
        Водитель:
          type: string
          maxLength: 500
          example: "Иванов Иван Иванович"
          description: ФИО водителя
        ПД_НомерАвто:
          type: string
          maxLength: 30
          example: "A001MP077"
          description: Гос. номер ТС
        ПД_НомерПрицепа:
          type: string
          maxLength: 30
          example: "A001MP077"
          description: Гос. номер прицепа
        МаркаАвто:
          type: string
          maxLength: 500
          example: "Gazzele"
          description: Марка автомобиля
        ТребуетсяВетСвидейтельство:
          type: boolean
          example: true
          description: Признак необходимости оформления Исходящего транспортного ВСД по данному заказу (false - не выписывать ВСД, true - выписывать ВСД)
        ТребуетсяВетСвидейтельствоКросс:
          type: boolean
          example: true
          description: Признак необходимости оформления Исходящего транспортного ВСД по данному заказу Кросс-док (false - не выписывать ВСД, true - выписывать ВСД)
        GUID_BE:
          type: string
          maxLength: 36
          example: "5535f338-fd9e-4556-93da-d05351c46330"
          description: GUID хозяйствующего субъекта-получателя (покупатель/получатель) в системе Меркурий. Элемент XML запроса создания транспортной партии delivery.consignee.businessEntity.guid
        GUID_En:
          type: string
          maxLength: 36
          example: "5535f338-fd9e-4556-93da-d05351c46330"
          description: GUID предприятия-получателя (грузополучатель) в системе Меркурий. Элемент XML запроса создания транспортной партии delivery.consignee.enterprise.guid
        мркТочкаМаршрута1:
          type: string
          maxLength: 500
          example: "1~fcd89443-218a-11e2-a69b-b499babae7ea~А123БВ190"
          description: "Информация о первой точке маршрута для выписки мультимодальных перевозок в Меркурий.


            Передается сл. информация (секции разделяются знаком ~)


            •	Код типа транспорта (от точки перегруза) согласно таблице
           

              o	1- Автомобильный
            

              o	2- Железнодорожный
            

              o	3- Авиатранспортный
              

              o	4- Морской
           

            •	GUID площадки в Меркурий (shipmentRoute.routePoint.enterprise.guid). 
            

            •	Гос. номер автомобиля/вагона/судна/авиарейса от этой точки 
            

            •	Гос. номер прицепа от этой точки (только для автомобильных перевозок)
           

            •	GUID Региона точки маршрута в Меркурий (обязательная секция, если не указан GUID). shipmentRoute.routePoint.location.address.region.guid
            

            •	Имя точки маршрута (обязательная секция если не указан GUID). shipmentRoute.routePoint.location.name
            

            Примеры:


            •	1~fcd89443-218a-11e2-a69b-b499babae7ea -  у точки перегруза есть GUID, номер авто и прицепа ещё не известен
            

            •	1~fcd89443-218a-11e2-a69b-b499babae7ea~А123БВ190 – у точки перегруза есть GUID, номер авто уже известен, номера прицепа нет
            

            •	1~~А123БВ190~~b8837188-39ee-4ff9-bc91-fcc9ed451bb3~ Пункт маршрута №1 – у точки перегруза нет GUID, номер авто уже известен, точка называется «Пункт маршрута №1», находиться в регионе Владимирская область  (GUID региона в Меркурий - b8837188-39ee-4ff9-bc91-fcc9ed451bb3)
            
            
            Допускается передача до 5 точек маршрута. Последующие точки нужно передавать через реквизиты - мркТочкаМаршрута2 и до мркТочкаМаршрута5. Правила заполнения этих реквизитов точно такие же, как и у данного."
        Комментарий:
            type: string
            maxLength: 500
            example: ФУД БАЗА
            description: Комментарий
        Товары:
          type: array
          description: Описание товаров в заказе
          items:
            type: object
            $ref: '#/components/schemas/ProductShipment'
        ПечатныеФормы:
          type: array
          description: >-
            В этом массиве описывается состав и свойства печатных форм,
            требуемых к распечатке по заказу на доставку
          items:
            type: object
            $ref: '#/components/schemas/PrintForm'  
    ShipmentUpdate:
      description: Объект "Заявка на отгрузку" (для обновление взятого в работу документа)
      properties:
        shipment:
          type: array
          items:
            type: object
            properties:
              ИД:
                type: string
                maxLength: 36
                example: 5535f338-fd9e-4556-93da-d05351c46330
                description: Уникальный ID заказа (идентификатор обновляемого объекта)
              Номер:
                type: string
                maxLength: 30
                example: "889843257"
                description: Дополнительный вариант поиска обновляемого объекта по номеру и дате поставки
              ДатаПоставки:
                type: string
                format: date
                example: 2022-12-30
                description: Дополнительный вариант поиска обновляемого объекта по номеру и дате поставки
              НомерТТН:
                type: string
                example: БП002333
                description: Номер накладной для вывода на печать. Например, обновленный номер УПД. 
              КоличествоМест:
                type: integer
                example: 5
                description: Обновленное количество товарных мест 
              КоличествоПаллет:
                type: integer
                example: 1
                description: Обновленное количество паллет по заявке
              Цены:
                type: array
                description: Для обновления обязательно должен быть заполнен один из двух вариантов цен 
                items:
                  type: object
                  properties:
                    НоменклатураКод:
                      type: string
                      maxLength: 36
                      example: "1822"
                      description: Код (для людей) номенклатуры в заказе, для которой передаются цены
                    Цена:
                      type: number
                      format: float
                      example: 137.5
                      description: Значение цены номенклатуры для обновления (будет установлена)
                    ЦенаСНДС:
                      type: number
                      format: float
                      example: 171.875
                      description: Значение цены номенклатуры с НДС для обновления (будет установлена)
   
    Reception:
      properties:
        reception:
